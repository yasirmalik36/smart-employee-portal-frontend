<div class="login-page">
    <div class="login-box">
      <h2>Sign In</h2>
      <p>Enter your email and password to sign in</p>
  
      <form (ngSubmit)="onLogin()">
        <mat-form-field appearance="outline" class="input-field">
          <mat-label>Email</mat-label>
          <input matInput type="email" placeholder="Email" required [(ngModel)]="email" name="email" />
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="input-field">
          <mat-label>Password</mat-label>
          <input matInput type="password" placeholder="Password" required [(ngModel)]="password" name="password" />
        </mat-form-field>
  
        <div class="remember-me">
          <mat-checkbox [(ngModel)]="rememberMe" (change)="toggleRememberMe()">Remember me</mat-checkbox>
        </div>
  
        <button mat-raised-button color="primary" class="login-button" type="submit">
          Sign In
        </button>
  
        <p class="signup-link">
          Don’t have an account? <a routerLink="/account/register">Sign up</a>
        </p>
      </form>
    </div>

  </div>
