<div class="flex justify-center items-center min-h-screen bg-cover bg-center relative" style="background-image: url('assets/images/bg_lock.jpg');">
    <div class="absolute inset-0 bg-black bg-opacity-20"></div>
    
    <!-- Back Button -->
    <button (click)="goBack()" class="absolute left-4 top-4 text-white text-lg">
        <i class="fas fa-arrow-left"></i> Back
    </button>

    <div class="relative bg-white p-8 rounded-lg shadow-md w-96">
        <div class="flex justify-center mb-4">
            <img src="assets/images/change-pass-image.svg" alt="Change Password" class="w-16 h-16">
        </div>
        
        <h2 class="text-center text-2xl font-bold text-gray-700 mb-4">Change Password</h2>
        
        <form [formGroup]="form" (ngSubmit)="changePassword(form.value)" autocomplete="off">
            <!-- Old Password Field -->
            <div class="mb-4">
                <label class="block text-gray-700">Old Password</label>
                <div class="relative">
                    <input [type]="oldPasswordVisible ? 'text' : 'password'" formControlName="oldPassword" class="w-full p-2 border rounded-md focus:ring focus:ring-blue-300 pr-10"
                        [class.border-red-500]="form.controls['oldPassword'].invalid && form.controls['oldPassword'].touched"
                        [class.border-green-500]="form.controls['oldPassword'].valid && form.controls['oldPassword'].touched">
                    
                    <!-- Eye Icon -->
                    <button type="button" (click)="toggleOldPasswordVisibility()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-600">
                        <i class="fas" [ngClass]="oldPasswordVisible ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                    
                    <!-- Error Message -->
                    <div *ngIf="form.controls['oldPassword'].invalid && form.controls['oldPassword'].touched" class="text-red-500 text-sm mt-1">Password is required</div>
                    <div *ngIf="form.controls['oldPassword'].valid && form.controls['oldPassword'].touched" class="text-green-500 text-sm mt-1">✔</div>
                </div>
            </div>
            
            <!-- New Password Field -->
            <div class="mb-4">
                <label class="block text-gray-700">New Password</label>
                <div class="relative">
                    <input [type]="newPasswordVisible ? 'text' : 'password'" formControlName="newPassword" class="w-full p-2 border rounded-md focus:ring focus:ring-blue-300 pr-10"
                        [class.border-red-500]="form.controls['newPassword'].invalid && form.controls['newPassword'].touched"
                        [class.border-green-500]="form.controls['newPassword'].valid && form.controls['newPassword'].touched">
                    
                    <!-- Eye Icon -->
                    <button type="button" (click)="toggleNewPasswordVisibility()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-600">
                        <i class="fas" [ngClass]="newPasswordVisible ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                    
                    <!-- Error Message -->
                    <div *ngIf="form.controls['newPassword'].errors?.['required'] && form.controls['newPassword'].touched" class="text-red-500 text-sm mt-1">New Password is required</div>
                    <div *ngIf="form.controls['newPassword'].errors?.['minlength'] && form.controls['newPassword'].touched" class="text-red-500 text-sm mt-1">Must be at least 8 characters</div>
                    <div *ngIf="form.controls['newPassword'].errors?.['hasNumber'] && form.controls['newPassword'].touched" class="text-red-500 text-sm mt-1">Must contain at least 1 number</div>
                    <div *ngIf="form.controls['newPassword'].errors?.['hasCapitalCase'] && form.controls['newPassword'].touched" class="text-red-500 text-sm mt-1">Must contain at least 1 uppercase letter</div>
                    <div *ngIf="form.controls['newPassword'].errors?.['hasSmallCase'] && form.controls['newPassword'].touched" class="text-red-500 text-sm mt-1">Must contain at least 1 lowercase letter</div>
                    <div *ngIf="form.controls['newPassword'].errors?.['hasSpecialCharacters'] && form.controls['newPassword'].touched" class="text-red-500 text-sm mt-1">Must contain at least 1 special character</div>
                    <div *ngIf="form.controls['newPassword'].valid && form.controls['newPassword'].touched" class="text-green-500 text-sm mt-1">✔</div>
                </div>
            </div>
            
            <!-- Confirm Password Field -->
            <div class="mb-4">
                <label class="block text-gray-700">Confirm Password</label>
                <div class="relative">
                    <input [type]="confirmPasswordVisible ? 'text' : 'password'" formControlName="confirmPassword" class="w-full p-2 border rounded-md focus:ring focus:ring-blue-300 pr-10"
                        [class.border-red-500]="form.controls['confirmPassword'].invalid && form.controls['confirmPassword'].touched"
                        [class.border-green-500]="form.controls['confirmPassword'].valid && form.controls['confirmPassword'].touched">
                    
                    <!-- Eye Icon -->
                    <button type="button" (click)="toggleConfirmPasswordVisibility()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-600">
                        <i class="fas" [ngClass]="confirmPasswordVisible ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                    
                    <!-- Error Message -->
                    <div *ngIf="form.controls['confirmPassword'].invalid && form.controls['confirmPassword'].touched" class="text-red-500 text-sm mt-1">Please confirm your password</div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="flex justify-center">
                <button type="submit" [disabled]="form.invalid" class="bg-blue-600 text-white py-2 px-6 rounded-md hover:bg-blue-700 transition duration-300 w-full">
                    Change Password
                </button>
            </div>
        </form>
    </div>
</div>
