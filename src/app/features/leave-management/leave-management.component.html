<div class="max-w-8xl mx-auto p-6 bg-white shadow-lg rounded-lg">
    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Leave Records</h2>
  <!-- Filter Form with 90% Width -->
<form (ngSubmit)="getLeaves()" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 w-full mx-auto">
    <!-- User ID -->
    <div class="w-full">
        <label for="leaveType" class="block text-sm font-medium text-gray-700">Leave Type</label>
        <select name="leaveType" [(ngModel)]="leaveRequest.leaveType" 
          class="border p-3 rounded w-full text-sm">
          <option *ngFor="let type of leaveTypes" [value]="type">{{ type }}</option>
        </select>
      </div>
  
    <!-- From Date -->
    <div class="w-full">
      <label class="block text-sm font-medium text-gray-700">From Date</label>
      <input type="date" [(ngModel)]="leaveRequest.dateFrom" name="dateFrom"
        class="mt-1 p-3 border rounded w-full" required />
    </div>
  
    <!-- To Date -->
    <div class="w-full">
      <label class="block text-sm font-medium text-gray-700">To Date</label>
      <input type="date" [(ngModel)]="leaveRequest.dateTo" name="dateTo"
        class="mt-1 p-3 border rounded w-full" required />
    </div>
  
    <!-- Submit Button (Takes Full Row) -->
    <div class="md:col-span-3 w-full">
      <button type="submit"
        class="w-full bg-green-600 text-white py-3 px-6 rounded hover:bg-green-700 transition">
        Search Leaves
      </button>
    </div>
  </form>
  
  
    <!-- Loading Indicator -->
    <div *ngIf="loading" class="text-center text-green-500">Loading...</div>
  
    <!-- Leaves Table -->
    <div *ngIf="leaveList.length > 0" class="overflow-x-auto">
      <table class="w-full border-collapse border border-gray-200">
        <thead>
          <tr class="bg-gray-100">
            <th class="border p-2">User ID</th>
            <th class="border p-2">Leave Type</th>
            <th class="border p-2">Start Date</th>
            <th class="border p-2">End Date</th>
            <th class="border p-2">Status</th>
            <th class="border p-2">Reason</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let leave of leaveList">
            <td class="border p-2 text-center">{{ leave.userID }}</td>
            <td class="border p-2 text-center">{{ leave.leaveType }}</td>
            <td class="border p-2 text-center">{{ leave.startDate | date }}</td>
            <td class="border p-2 text-center">{{ leave.endDate | date }}</td>
            <td class="border p-2 text-center">{{ leave.status }}</td>
            <td class="border p-2 text-center">{{ leave.reason || 'N/A' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <!-- No Records Message -->
    <div *ngIf="leaveList.length === 0 && !loading" class="text-center text-gray-500 mt-4">
      No leave records found.
    </div>
  </div>
