<div class="min-h-screen bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 p-4 overflow-y-auto">
    <header
      class="bg-white dark:bg-gray-800 text-blue-700 p-4 shadow-md flex items-center rounded-lg mb-4"
    >

      <h1 class="text-xl font-semibold ">     
         <mat-icon class="mr-2 ">description</mat-icon>
        Reports</h1>
    </header>
  
    <main class="space-y-6">
      <section class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300">
        <h2 class="text-2xl font-semibold mb-4 flex items-center text-blue-700">
          <mat-icon class="mr-2">insert_chart</mat-icon>
          Generate Report
        </h2>
  
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <mat-form-field class="w-full">
            <mat-label>Report Type</mat-label>
            <mat-select [(ngModel)]="reportType">
              <mat-option *ngFor="let type of reportTypes" [value]="type">
                <mat-icon class="mr-2">{{ getReportIcon(type) }}</mat-icon>
                {{ type | titlecase }}
              </mat-option>
            </mat-select>
          </mat-form-field>
  
          <mat-form-field class="w-full">
            <mat-label>Start Date</mat-label>
            <input matInput [matDatepicker]="startDatePicker" [(ngModel)]="startDate" />
            <mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #startDatePicker></mat-datepicker>
          </mat-form-field>
  
          <mat-form-field class="w-full">
            <mat-label>End Date</mat-label>
            <input matInput [matDatepicker]="endDatePicker" [(ngModel)]="endDate" />
            <mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #endDatePicker></mat-datepicker>
          </mat-form-field>
  
          <mat-form-field class="w-full">
            <mat-label>Department</mat-label>
            <mat-select [(ngModel)]="department">
              <mat-option *ngFor="let dept of departments" [value]="dept">{{ dept }}</mat-option>
            </mat-select>
          </mat-form-field>
  
          <mat-form-field class="w-full">
            <mat-label>Employee</mat-label>
            <mat-select [(ngModel)]="employee">
              <mat-option *ngFor="let emp of employees" [value]="emp">{{ emp }}</mat-option>
            </mat-select>
          </mat-form-field>
  
          <div class="col-span-1 md:col-span-2">
            <button
              mat-raised-button
              color="primary"
              (click)="generateReport()"
              class="w-half py-3 rounded-md shadow-md hover:bg-blue-700 transition-colors duration-300"
            >
              <mat-icon class="mr-2">file_download</mat-icon>
              Generate Report
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>
