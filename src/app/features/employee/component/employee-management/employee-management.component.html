<!-- In your parent component template -->

<div class=" p-4 pb-2  h-full    mb-8" >
 <!-- Header Section -->
<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-5">
    <div class="bg-white rounded-lg p-2 flex w-full items-center justify-between">
      
      <!-- Left Side: Title and Search Field -->
      <div class="flex items-center gap-4 flex-1">
        <h2 class="text-xl font-semibold flex items-center " style="margin-top: 10px;">
          <mat-icon class="mr-2">group</mat-icon>
          Employee Management
        </h2>
        
        <!-- Search Bar -->
        <div class="relative w-72">
          <input
            type="text"
            placeholder="Search..."
            class="w-full py-2 pl-10 pr-4 bg-gray-50 rounded-lg shadow-inner focus:ring-2 focus:ring-yellow-500 focus:outline-none"
            (input)="applyFilter($event)"
          />
          <span class="material-icons absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">search</span>
        </div>
      </div>
  
      <!-- Right Side: Buttons -->
      <div class="flex gap-4">
        <button mat-raised-button color="primary" class="equal-width">
          <mat-icon>person_add</mat-icon> Add Employee
        </button>
  
        <button *ngIf="profiletype === '1'" mat-raised-button color="warn" class="equal-width">
          <mat-icon>import_export</mat-icon> Export
        </button>
      </div>
  
    </div>
  </div>
  
    <div class="mt-4 overflow-auto mb-4" [ngClass]="tableWidth()">
  
        <!-- Table Container -->
        <div class="overflow-hidden mb-4">
      
          <!-- Scrollable Table Wrapper -->
          <div class="overflow-auto relative" [style.height]="TableHeight()">
        <table mat-table [dataSource]="dataSource" matSort id="excel-table"  class="mat-elevation w-full min-w-max ">
  
            <!-- Dynamic Column Definition -->
            <ng-container *ngFor="let column of columns" [matColumnDef]="column.columnDef">
              
              <!-- Table Header -->
              <mat-header-cell *matHeaderCellDef mat-sort-header [style.min-width]="column.width" [style.max-width]="column.width">
                {{ column.header }}
              </mat-header-cell>
          
              <!-- Table Cell -->
              <mat-cell *matCellDef="let row" [style.min-width]="column.width" [style.max-width]="column.width">
                
                <!-- Default Data Rendering (Excluding Certain Columns) -->
                <div *ngIf="column.columnDef !== 'delete' && column.columnDef !== 'edit' && column.columnDef !== 'reset' && column.columnDef !== 'Is_Active' && column.columnDef !== 'Employee_Name'">
                  <div *ngIf="column.cell">
                    {{ common.checkForNull(column.cell(row)) }}
                  </div>
                </div>
          
                <div *ngIf="column.columnDef === 'edit'">
                  <span style="cursor: pointer;" matTooltip="Edit" class="mr-2">
                    <mat-icon color="primary">edit</mat-icon>
                  </span>
                </div>
                                <div *ngIf="column.columnDef === 'delete'">
                                    <span *ngIf="profiletype === '1'" matTooltip="Delete">
                                      <mat-icon style="cursor: pointer;" color="warn">delete</mat-icon>
                                    </span>
                                  </div>
                <div *ngIf="column.columnDef == 'reset' ">
                    <span style="cursor: pointer; color: #007BFF; display: flex; align-items: center; gap: 5px;"
                       matTooltip="Reset Password"
                       (click)="resetPassword(row)" >
                      <mat-icon>lock_reset</mat-icon>
                </span>
                  </div>
                  <div *ngIf="column.columnDef === 'Is_Active'">
                    <mat-checkbox disabled [checked]="row.Is_Active"></mat-checkbox>
                  </div>
                  
                <!-- Employee Name Column with Image -->
                <div *ngIf="column.columnDef === 'Employee_Name'" class="flex items-center space-x-3">
                  <img 
                    [src]="getEmployeeDetails(row).image" 
                    alt="Employee Image" 
                    class="w-8 h-8 rounded-full border border-gray-300 shadow-md transition-all duration-200 hover:scale-125 hover:shadow-lg hover:ring-2 hover:ring-blue-300 hover:bg-gray-100"
                  />
                  <div class="text-xs">
                    <div class="font-semibold text-gray-800">{{ getEmployeeDetails(row).name }}</div>
                    <div class="text-gray-600">{{ getEmployeeDetails(row).gender }} | {{ getEmployeeDetails(row).dob }}</div>
                  </div>
                </div>
          
              </mat-cell>
            </ng-container>
          
            <!-- Table Header Row -->
            <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
          
            <!-- Table Data Rows -->
            <mat-row *matRowDef="let row; columns: displayedColumns;"
                     (mouseover)="row.hovered = true"
                     (mouseout)="row.hovered = false"
                     [ngClass]="{hovered: row.hovered}"
                     class="element-row"
                     matRipple>
            </mat-row>
          
          </table>
          
  
   
    
  </div>
  <div class="sticky bottom-0 left-0 bg-white shadow-md w-full flex justify-end pr-4 border border-gray-300">
    <mat-paginator class="mr-2"
      pageSize="10" [pageSizeOptions]="[10, 20, 30, 50,]" showFirstLastButtons></mat-paginator>
    </div>
</div>
  
</div>
  
</div>
