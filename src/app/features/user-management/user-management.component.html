<div class="container mx-auto p-6 bg-gray-50">
    <!-- Page Title -->
    <h3 class="text-2xl font-semibold text-gray-800 mb-6">User Management</h3>
  
    <!-- Search Bar and Add User Button -->
    <div class="flex justify-between items-center mb-6">
      <!-- Search Bar -->
      <div class="relative w-1/3">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="Search users..."
          class="w-full py-2 pl-10 pr-4 bg-gray-50 rounded-lg shadow-inner focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
        <span class="material-icons absolute left-2 top-1/2 transform -translate-y-1/2 text-gray-400">search</span>
      </div>
  
      <!-- Add User Button -->
      <button
        (click)="addUser()"
        class="px-6 py-2 bg-primary text-white rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        Add User
      </button>
    </div>
  
    <!-- Users Table -->
    <div class="overflow-x-auto bg-white rounded-lg shadow-lg">
      <table class="min-w-full table-auto">
        <thead class="bg-blue-600 text-white">
          <tr>
            <th class="py-3 px-4 text-left">Name</th>
            <th class="py-3 px-4 text-left">Email</th>
            <th class="py-3 px-4 text-left">Role</th>
            <th class="py-3 px-4 text-left">Status</th>
            <th class="py-3 px-4 text-left">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td class="py-3 px-4 border-b">{{ user.name }}</td>
            <td class="py-3 px-4 border-b">{{ user.email }}</td>
            <td class="py-3 px-4 border-b">{{ user.role }}</td>
            <td class="py-3 px-4 border-b">
              <span
                [ngClass]="{
                  'bg-green-500': user.status === 'Active',
                  'bg-gray-500': user.status === 'Inactive'
                }"
                class="text-white px-2 py-1 rounded-full"
              >
                {{ user.status }}
              </span>
            </td>
            <td class="py-3 px-4 border-b">
              <button
                (click)="editUser(user.id)"
                class="px-4 py-1 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600"
              >
                Edit
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
