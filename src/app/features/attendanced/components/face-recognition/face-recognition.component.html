
<div class="max-w-lg mx-auto bg-white p-6 shadow-lg rounded-lg">
  <h2 class="text-2xl font-semibold text-gray-800 mb-4">Face Recognition Attendance</h2>
  <div class="text-center">
    <webcam [trigger]="triggerObservable" (imageCapture)="handleImage($event)" class="rounded-lg shadow-md"></webcam>
    <button (click)="triggerSnapshot()" class="mt-4 px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
      Capture Face
    </button>
  </div>
  <div *ngIf="isScanning" class="text-center text-blue-500 mt-4">Scanning...</div>
  <div *ngIf="scanResult" class="text-center mt-4 font-semibold text-green-600">
    {{ scanResult }}
  </div>
</div>
