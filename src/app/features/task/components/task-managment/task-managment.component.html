<!-- src/app/features/task/components/task-managment/task-managment.component.html -->

<div class="p-6">
    <h2 class="text-xl font-bold mb-4">Task Management</h2>
  
    <button class="bg-green-600 text-white px-4 py-2 rounded mb-4" (click)="openAddForm()">Add Task</button>
  
    <div *ngIf="isFormVisible" class="mb-4">
      <app-add-task
        [task]="selectedTask"
        (saveTask)="saveTask($event)"
        (close)="closeForm()"
      ></app-add-task>
    </div>
  
    <table class="w-full border border-collapse">
      <thead class="bg-gray-200">
        <tr>
          <th class="p-2 border">Title</th>
          <th class="p-2 border">Assigned To</th>
          <th class="p-2 border">Due Date</th>
          <th class="p-2 border">Status</th>
          <th class="p-2 border">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let task of tasks" class="border-t">
          <td class="p-2 border">{{ task.title }}</td>
          <td class="p-2 border">{{ task.assignedTo }}</td>
          <td class="p-2 border">{{ task.dueDate }}</td>
          <td class="p-2 border">{{ task.status }}</td>
          <td class="p-2 border">
            <button class="text-blue-600" (click)="openEditForm(task)">Edit</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
